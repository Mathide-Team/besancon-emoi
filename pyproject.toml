[project]
name = "besancon-emoi"
version = "0.1.0"
description = "Intégration Home Assistant pour le portail Besançon et moi (eau : factures, index, relevés)"
requires-python = ">=3.13.2,<3.14"
license = "MIT"

[dependency-groups]
# Versions figées (socle) : à monter volontairement.
test = [
    "beautifulsoup4>=4.12.2",
    "pypdf>=5.0.0",  # lecture du total TTC dans le PDF de facture
    "pytest-homeassistant-custom-component==0.13.316",  # Home Assistant 2026.2.3, Python 3.13
]
lint = ["ruff==0.17.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["scripts/check_branch_protection.py"]  # script du socle (modele-depot), gardé tel quel

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["custom_components/besancon_emoi"]
branch = true

[tool.coverage.report]
# Seuil bloquant de l'équipe (Mathilde-Team/.github#9) : lignes + branches.
# Appliqué par `pytest --cov` (job Qualité de ci.yml).
fail_under = 95
show_missing = true

[tool.uv]
package = false  # intégration HA, pas un paquet Python publié
